name: Validate Forge contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile contract tooling
        run: |
          python -m py_compile \
            scripts/schema_validation.py \
            scripts/validate-run-bundle.py \
            scripts/evaluate-corpus.py \
            scripts/resolve-profile.py \
            scripts/validate-governance.py \
            scripts/validate-run-governance.py \
            scripts/validate-pack.py \
            scripts/resolve-runtime.py \
            scripts/runtime_configuration.py \
            scripts/validate-runtime-configuration.py \
            scripts/validate-project-profile.py \
            scripts/render-plan-input.py \
            scripts/resolve-lanes.py \
            scripts/export-run-bundle.py \
            scripts/verify-export-bundle.py \
            scripts/generate-contract-fixture.py \
            scripts/sync-agent-adapters.py \
            examples/inspect-evidence.py \
            examples/first-change/create_demo.py
      - name: Check portable prompts and adapter copies
        run: python scripts/sync-agent-adapters.py
      - name: Parse all published schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = sorted(Path('docs/agent/schemas').glob('*.json'))
          assert paths, 'no schemas found'
          for path in paths:
              schema = json.loads(path.read_text(encoding='utf-8'))
              assert schema.get('$schema'), f'{path}: missing $schema'
              assert schema.get('$id'), f'{path}: missing $id'
              print(f'parsed {path}')
          PY
      - name: Validate desktop model configuration fixture
        run: python scripts/validate-runtime-configuration.py tests/fixtures/runtime-configuration.json
      - name: Test routing and optional operator tools
        run: python -m unittest discover -s tests -v
      - name: Compile governed host
        run: python -m compileall -q scripts/forge_host scripts/forge-host.py scripts/close-run.py
      - name: Qualify real Docker commands and full host run
        run: |
          docker pull python:3.12-slim
          export FORGE_DOCKER_IMAGE=$(docker image inspect python:3.12-slim --format '{{.Id}}')
          python tests/docker_conformance.py -v
      - name: Create and test the disposable onboarding repository
        run: python examples/first-change/create_demo.py
      - name: Validate governance contracts and evaluation corpus
        run: |
          python scripts/validate-governance.py
          python scripts/evaluate-corpus.py
      - name: Validate portable v2 pack
        run: python scripts/validate-pack.py packs/rgr-software-v2/pack.json --hash-report /tmp/pack-hashes.json
      - name: Exercise deterministic profile resolution
        run: |
          cat > /tmp/small.json <<'JSON'
          {"story_id":"CI-SMALL","facts":{"risk_tags":[],"blast_radius":"low","uncertainty":"low","changed_module_count":1,"cross_service":false,"contract_change":false,"data_migration":false,"security_sensitive":false,"infrastructure_change":false}}
          JSON
          python scripts/resolve-profile.py /tmp/small.json --output /tmp/small-resolution.json
          grep -q '"selected_profile": "small"' /tmp/small-resolution.json

          cat > /tmp/high.json <<'JSON'
          {"story_id":"CI-HIGH","facts":{"risk_tags":["domain:auth"],"blast_radius":"medium","uncertainty":"low","changed_module_count":2,"cross_service":false,"contract_change":false,"data_migration":false,"security_sensitive":true,"infrastructure_change":false}}
          JSON
          python scripts/resolve-profile.py /tmp/high.json --output /tmp/high-resolution.json
          grep -q '"selected_profile": "high-risk"' /tmp/high-resolution.json
          grep -q '"threat_modeler"' /tmp/high-resolution.json
      - name: Exercise governed runtime routing
        run: |
          cat > /tmp/runtime-local.json <<'JSON'
          {"stage":"green_code","role":"implementer","available_targets":["local-code","frontier-default"]}
          JSON
          python scripts/resolve-runtime.py /tmp/runtime-local.json --output /tmp/runtime-local-selection.json
          grep -q '"target_id": "local-code"' /tmp/runtime-local-selection.json
          grep -q '"locality": "local"' /tmp/runtime-local-selection.json

          cat > /tmp/runtime-fallback.json <<'JSON'
          {"stage":"green_code","role":"implementer","available_targets":["frontier-default"]}
          JSON
          python scripts/resolve-runtime.py /tmp/runtime-fallback.json --output /tmp/runtime-fallback-selection.json
          grep -q '"target_id": "frontier-default"' /tmp/runtime-fallback-selection.json
          grep -q '"fallback": true' /tmp/runtime-fallback-selection.json

          cat > /tmp/runtime-overlay.json <<'JSON'
          {"stage":"green_code","role":"implementer","available_targets":["local-code","frontier-default"],"overlay":{"implementer":"frontier-default"},"overlay_source":"operator"}
          JSON
          python scripts/resolve-runtime.py /tmp/runtime-overlay.json --output /tmp/runtime-overlay-selection.json
          grep -q '"overlay_applied": true' /tmp/runtime-overlay-selection.json

          cat > /tmp/runtime-repo-overlay.json <<'JSON'
          {"stage":"green_code","role":"implementer","available_targets":["local-code","frontier-default"],"overlay":{"implementer":"frontier-default"},"overlay_source":"repository"}
          JSON
          if python scripts/resolve-runtime.py /tmp/runtime-repo-overlay.json; then
            echo 'repository-controlled runtime overlay unexpectedly passed' >&2
            exit 1
          fi
      - name: Exercise structured intake, trusted project profile and lane resolution
        run: |
          cat > /tmp/project-profile.json <<'JSON'
          {"schema_version":"1.0","project_id":"ci-project","profile_version":"1","provenance":{"source":"operator","issued_by":"ci","issued_at":"2026-01-01T00:00:00Z","source_ref":null},"project":{"root":".","stack":["python"],"frameworks":[],"commands":{"build":["python -m py_compile app.py"],"test":["python -m unittest"],"lint":[]},"architecture":{"style":"service","source_of_truth":"docs/architecture.md"},"modules":[],"environment":"test"},"decisions":{"database":"postgres"},"constraints":["No production credentials"]}
          JSON
          python scripts/validate-project-profile.py /tmp/project-profile.json --expected-project-id ci-project

          cat > /tmp/intake.json <<'JSON'
          {"schema_version":"1.0","intake_id":"CI-INTAKE","rounds":5,"status":"ready","raw_request":"Add a bounded fixture feature","project_profile_ref":"project-profile.json","resolved":[{"field":"database","value":"postgres","source":"trusted_project_profile","source_ref":"project-profile.json","confidence":"high","authority":"authoritative"}],"questions":[],"task_spec":{"title":"Fixture feature","description":"Add a bounded fixture feature.","requirements":["Keep behaviour deterministic"],"constraints":["No production credentials"],"acceptance_criteria":["Given fixture input, fixture output is returned"],"user_decisions":{}}}
          JSON
          python scripts/render-plan-input.py /tmp/intake.json --output /tmp/plan-input.md
          grep -q 'source: structured-intake' /tmp/plan-input.md

          echo 'Reject intake beyond five rounds'
          python - <<'PY'
          import json, sys
          sys.path.insert(0, 'scripts')
          from schema_validation import validate_instance
          schema=json.load(open('docs/agent/schemas/intake.schema.json'))
          doc=json.load(open('/tmp/intake.json'))
          assert validate_instance(doc, schema) == []
          doc['rounds']=6
          assert validate_instance(doc, schema), 'six intake rounds unexpectedly accepted'
          print('five-round intake boundary passed')
          PY

          cat > /tmp/lanes-parallel.json <<'JSON'
          {"schema_version":"1.0","story_id":"CI-LANES","status":"locked","tasks":[{"id":"TASK-1","stage":"red_test","description":"Write failing test","depends_on":[],"outputs":["tests/test_api.py"],"criteria":["SC-1"]},{"id":"TASK-2","stage":"green_code","description":"Implement backend","depends_on":["TASK-1"],"outputs":["backend/app.py"],"criteria":["SC-1"]},{"id":"TASK-3","stage":"green_code","description":"Implement frontend","depends_on":["TASK-1"],"outputs":["frontend/app.ts"],"criteria":["SC-1"]}],"criterion_test_map":[{"sc_id":"SC-1","test_ids":["TEST-1"]}],"implementation_lanes":[{"id":"LANE-backend","kind":"backend","description":"Backend lane","task_ids":["TASK-2"],"write_surfaces":["backend"],"depends_on_lanes":[]},{"id":"LANE-frontend","kind":"frontend","description":"Frontend lane","task_ids":["TASK-3"],"write_surfaces":["frontend"],"depends_on_lanes":[]}]}
          JSON
          python scripts/resolve-lanes.py /tmp/lanes-parallel.json --output /tmp/lanes-parallel-resolution.json
          grep -q '"mode": "parallel"' /tmp/lanes-parallel-resolution.json

          python - <<'PY'
          import json
          p='/tmp/lanes-parallel.json'
          d=json.load(open(p))
          d['implementation_lanes'][1]['write_surfaces']=['backend/shared']
          d['tasks'][2]['outputs']=['backend/shared/app.ts']
          json.dump(d, open('/tmp/lanes-overlap.json','w'))
          PY
          python scripts/resolve-lanes.py /tmp/lanes-overlap.json --output /tmp/lanes-overlap-resolution.json
          grep -q '"mode": "sequential"' /tmp/lanes-overlap-resolution.json

      - name: Reject legacy indexed retrieval references
        run: |
          if grep -RniE 'OpenSearch|OPENSEARCH_|(^|[^[:alnum:]_])RAG([^[:alnum:]_]|$)|skill-rag-search|rag-search\.sh|RAG_REQUIRED|ai-pipeline-rag|"rag-read"|rag-derived' \
            --exclude-dir=.git --exclude=CHANGELOG.md --exclude=validate-local-rgr.yml .; then
            echo 'legacy indexed retrieval reference found' >&2
            exit 1
          fi

      - name: Exercise schema validator reference and failure paths
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from schema_validation import validate_instance
          schema = {
              'type': 'object',
              'additionalProperties': False,
              'required': ['item'],
              'properties': {'item': {'$ref': '#/$defs/name'}},
              '$defs': {'name': {'type': 'string', 'minLength': 2}}
          }
          assert validate_instance({'item': 'ok'}, schema) == []
          assert validate_instance({'item': 'x'}, schema)
          assert validate_instance({'item': 'ok', 'extra': True}, schema)
          print('schema validator reference, positive and negative paths passed')
          PY
      - name: Exercise the documented evidence and tamper-rejection example
        run: python examples/inspect-evidence.py
