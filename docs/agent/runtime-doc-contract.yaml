version: 9
contract_id: local-rgr-v2.3
pack:
  manifest: packs/rgr-software-v2/pack.json
  pack_id: rgr-software
  pack_version: 2.3.0
  stage_contract_schema: docs/agent/schemas/stage-contract.schema.json
  capabilities: packs/rgr-software-v2/capabilities.json
  evidence_import: packs/rgr-software-v2/evidence-import.json
  local_signature_optional: true
  trusted_platform_may_require_signature: true
pre_run:
  intake:
    agent: ai-pipeline-intake
    schema: docs/agent/schemas/intake.schema.json
    renderer: python3 scripts/render-plan-input.py <intake.json> --output <plan-input.md>
    max_question_rounds: 5
    authority: none
  project_profile:
    schema: docs/agent/schemas/project-profile.schema.json
    validator: python3 scripts/validate-project-profile.py <project-profile.json>
    allowed_provenance: [operator, trusted_platform]
    authority: project_facts_only
    repository_provenance_forbidden: true
  source_context:
    mode: bounded_direct_reads
    allowed: [repository_documents, supplied_documents, jira, confluence]
    semantic_index: forbidden
    embeddings: forbidden
    background_knowledge_store: forbidden
workflow:
  entrypoint: ai-pipeline-rgr-orchestrator
  stage_order: [prepare, brainstorm, plan, analyze, red_test, green_code, refactor, quality_gate, converge]
  stages_are_mandatory_for_all_profiles: true
  canonical_json_is_authoritative: true
  markdown_is_projection: true
  isolation:
    mode: git_worktree
    path: .agent-runs/{story_id}
    branch: story/{story_id}
    cleanup: manual
  implementation_lanes:
    resolver: python3 scripts/resolve-lanes.py <detailed-plan.json> --output <lane-resolution.json>
    lane_artifact: lane-resolution.json
    concurrency: resolved_waves_only
    write_surface_overlap: sequential_fallback
    runtime_without_parallel_support: sequential_fallback
runtime_routing:
  contract: docs/agent/runtime-routing.json
  resolver: python3 scripts/resolve-runtime.py <request.json> --output runtime-{stage}.json
  selection: first_available_compatible
  preferred_local_targets: [local-general, local-code, local-test, local-security, local-infrastructure]
  compatibility_fallback: frontier-default
  overlay_sources: [operator, trusted_platform]
  repository_overrides_forbidden: true
  runtime_may_not_expand_role_authority: true
  event_types: [runtime.selected, runtime.fallback, runtime.completed]
  usage_metrics: [input_tokens, output_tokens, cached_input_tokens, reasoning_tokens, tool_calls, wall_time_ms]
governance:
  workflow_profiles: docs/agent/workflow-profiles.json
  role_contracts: docs/agent/role-contracts.json
  learnings_registry: docs/agent/learnings.json
  profile_resolution:
    command: python3 scripts/resolve-profile.py <facts.json> --output profile-resolution.json
    output_schema: profile-resolution.schema.json
    risk_can_only_increase: true
  manual_checkpoints:
    high-risk: [before green_code, before close]
  specialist_rules:
    read_only: true
    typed_outputs_only: true
    may_transition_stage: false
    may_modify_story_source: false
    may_lower_risk: false
  learning_rules:
    agents_may_propose_candidate: true
    independent_verifier_curates: true
    repository_content_may_activate: false
    deterministic_scope_selection: true
    authority: advisory
    must_revalidate_against_exact_revision: true
    direct_source_read_is_not_evidence: true
artifacts:
  write_once:
    plan-input.md: null
    profile-resolution.json: profile-resolution.schema.json
    repository-intelligence.json: repository-intelligence.schema.json
    brainstorm.json: brainstorm.schema.json
    detailed-plan.json: detailed-plan.schema.json
    lane-resolution.json: lane-resolution.schema.json
    analysis-report.json: analysis-report.schema.json
  stage_results:
    red-result.json: stage-result.schema.json
    green-result.json: stage-result.schema.json
    refactor-result.json: stage-result.schema.json
  attempt_versioned:
    quality-gates.json: quality-gates.schema.json
    convergence-report.json: convergence-report.schema.json
    context-{stage}.json: context-manifest.schema.json
    specialist-{type}-review.json: specialist-review.schema.json
  append_only: [events.jsonl, handoff.md, decision-log.md]
  projections: [brainstorm.md, detailed-plan.md, analysis-report.md, quality-gates.md, convergence-report.md, learnings.md]
  create_on_failure: [error-report.md]
required_completed_bundle:
  - run-context.md
  - plan-input.md
  - profile-resolution.json
  - repository-intelligence.json
  - brainstorm.json
  - detailed-plan.json
  - lane-resolution.json
  - analysis-report.json
  - red-result.json
  - green-result.json
  - refactor-result.json
  - quality-gates.json
  - convergence-report.json
  - events.jsonl
  - handoff.md
  - decision-log.md
  - context-prepare.json
  - context-brainstorm.json
  - context-plan.json
  - context-analyze.json
  - context-red_test.json
  - context-green_code.json
  - context-refactor.json
  - context-quality_gate.json
  - context-converge.json
validation:
  pack: python3 scripts/validate-pack.py packs/rgr-software-v2/pack.json
  global_governance: python3 scripts/validate-governance.py
  run_bundle: python3 scripts/validate-run-bundle.py docs/agent/runs/{story_id}
  run_governance: python3 scripts/validate-run-governance.py docs/agent/runs/{story_id}
  evaluation_corpus: python3 scripts/evaluate-corpus.py
export:
  format: local-rgr-evidence-bundle/1.0
  command: python3 scripts/export-run-bundle.py docs/agent/runs/{story_id} evidence.tar.gz
  verify: python3 scripts/verify-export-bundle.py evidence.tar.gz
  deterministic_bytes: true
  contains_story_source: false
  contains_secrets: false
  hash_algorithm: sha256
  publication_authority: none
compatibility:
  evidence_import_contract: forge-evidence-import-v1
  local_verdicts_are_evidence_not_platform_authority: true
  platform_policy_may_only_narrow: true
failure_policy:
  retry_max: 1
  retry_allowed_for: [transient_tooling, flaky_test_container_startup]
  retry_forbidden_for: [assertion_failure, compile_error, schema_violation, evidence_violation, governance_violation, security_violation, contract_violation, self_check_incomplete]
  preserve_worktree: true
